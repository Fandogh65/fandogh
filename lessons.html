<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>همه درس‌ها | فندق</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon">🌰</div>
            <h2>ف<span>ندق</span></h2>
        </div>
        <nav class="menu">
            <a href="index.html" class="menu-item">🏠 داشبورد</a>
            <a href="lessons.html" class="menu-item active">📚 درس‌ها</a>
            <a href="profile.html" class="menu-item">👤 پروفایل</a>
            <a href="support.html" class="menu-item">💬 پشتیبانی</a>
            <a href="earn-coins.html" class="menu-item">🪙 سکه رایگان</a>
            <a href="login.html" class="menu-item" id="loginMenuItem">🔐 ورود</a>
            <a href="register.html" class="menu-item" id="registerMenuItem">📝 ثبت‌نام</a>
            <a href="#" class="menu-item" id="logoutMenuItem" style="display:none;" onclick="logoutUser()">🚪 خروج</a>
            <a href="admin.html" class="menu-item" id="adminMenuItem" style="display:none;">⚙️ پنل مدیریت</a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="welcome">
                <h1>📚 همه درس‌ها</h1>
                <p>از پایه تا پیشرفته</p>
            </div>
            <div class="user">
                <div class="user-info">
                    <strong id="headerUsername">کاربر مهمان</strong>
                    <span id="headerUserStatus">ثبت‌نام نشده</span>
                </div>
                <div class="coin-display">
                    <span class="coin-icon">🪙</span>
                    <span class="coin-count" id="headerCoinCount">0</span>
                </div>
                <div class="avatar">👤</div>
            </div>
        </header>

        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="searchLessons" placeholder="🔍 جستجوی درس...">
            </div>
        </div>

        <section class="lessons" id="allLessonsContainer"></section>

        <section class="stats-bottom">
            <div class="stat-bottom-card">
                <span>📊 پیشرفت کلی</span>
                <div class="progress">
                    <div class="progress-bar" id="overallProgress" style="width:0%;"></div>
                </div>
                <span id="overallProgressText">۰%</span>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
