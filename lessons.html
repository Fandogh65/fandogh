<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>همه درس‌ها | فندق</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn">
        <i class="fas fa-bars"></i>
    </button>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">🌰</div>
            <h2>ف<span>ندق</span></h2>
        </div>
        <nav class="menu">
            <a href="index.html" class="menu-item">
                <span class="menu-icon">🏠</span>
                <span>داشبورد</span>
            </a>
            <a href="lessons.html" class="menu-item active">
                <span class="menu-icon">📚</span>
                <span>درس‌ها</span>
            </a>
            <a href="profile.html" class="menu-item">
                <span class="menu-icon">👤</span>
                <span>پروفایل</span>
            </a>
            <a href="support.html" class="menu-item">
                <span class="menu-icon">💬</span>
                <span>پشتیبانی</span>
            </a>
            <a href="earn-coins.html" class="menu-item">
                <span class="menu-icon">🪙</span>
                <span>سکه رایگان</span>
            </a>
            <a href="login.html" class="menu-item">
                <span class="menu-icon">🔐</span>
                <span>ورود</span>
            </a>
            <a href="admin.html" class="menu-item" id="adminMenuItem" style="display:none;">
                <span class="menu-icon">⚙️</span>
                <span>پنل مدیریت</span>
            </a>
        </nav>
    </aside>

    <main class="main">

        <header class="topbar">
            <div class="welcome">
                <h1>📚 همه درس‌های کره‌ای</h1>
                <p>از پایه تا پیشرفته، همه درس‌ها اینجا هستند.</p>
            </div>
            <div class="user">
                <div class="user-info">
                    <strong id="headerUsername">کاربر مهمان</strong>
                    <span id="headerUserStatus">ثبت‌نام نشده</span>
                </div>
                <div class="avatar">👤</div>
            </div>
        </header>

        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="searchLessons" placeholder="🔍 جستجوی درس...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">همه</button>
                <button class="filter-btn" data-filter="in-progress">در حال پیشرفت</button>
                <button class="filter-btn" data-filter="completed">تکمیل شده</button>
                <button class="filter-btn" data-filter="not-started">شروع نشده</button>
            </div>
        </div>

        <section class="lessons" id="allLessonsContainer"></section>

        <section class="stats-bottom">
            <div class="stat-bottom-card">
                <span>📊 پیشرفت کلی</span>
                <div class="progress">
                    <div class="progress-bar" id="overallProgress" style="width: 0%;"></div>
                </div>
                <span id="overallProgressText">۰%</span>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
