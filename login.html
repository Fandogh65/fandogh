<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | فندق</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn">
        <i class="fas fa-bars"></i>
    </button>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">🌰</div>
            <h2>ف<span>ندق</span></h2>
        </div>
        <nav class="menu">
            <a href="index.html" class="menu-item">
                <span class="menu-icon">🏠</span>
                <span>داشبورد</span>
            </a>
            <a href="lessons.html" class="menu-item">
                <span class="menu-icon">📚</span>
                <span>درس‌ها</span>
            </a>
            <a href="profile.html" class="menu-item">
                <span class="menu-icon">👤</span>
                <span>پروفایل</span>
            </a>
            <a href="support.html" class="menu-item">
                <span class="menu-icon">💬</span>
                <span>پشتیبانی</span>
            </a>
            <a href="earn-coins.html" class="menu-item">
                <span class="menu-icon">🪙</span>
                <span>سکه رایگان</span>
            </a>
            <a href="login.html" class="menu-item active">
                <span class="menu-icon">🔐</span>
                <span>ورود</span>
            </a>
            <a href="admin.html" class="menu-item" id="adminMenuItem" style="display:none;">
                <span class="menu-icon">⚙️</span>
                <span>پنل مدیریت</span>
            </a>
        </nav>
    </aside>

    <main class="main">

        <header class="topbar">
            <div class="welcome">
                <h1>🔐 ورود به حساب</h1>
                <p>به فندق خوش اومدی!</p>
            </div>
            <div class="user">
                <div class="user-info">
                    <strong id="headerUsername">کاربر مهمان</strong>
                    <span id="headerUserStatus">ثبت‌نام نشده</span>
                </div>
                <div class="avatar">👤</div>
            </div>
        </header>

        <section class="auth-card">
            <form id="loginForm">

                <div class="form-group">
                    <label>نام کاربری</label>
                    <input type="text" id="loginUsername" placeholder="نام کاربری خود را وارد کن" required>
                </div>

                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="loginPassword" placeholder="رمز عبور خود را وارد کن" required>
                </div>

                <button type="submit" class="primary-btn" style="width:100%;">🚪 ورود</button>

                <div style="text-align:center;margin-top:15px;color:#7f8da5;font-size:13px;">
                    حساب کاربری نداری؟ <a href="register.html" style="color:#21d4c3;text-decoration:none;">ثبت‌نام کن</a>
                </div>

            </form>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
