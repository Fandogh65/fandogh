<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | فندق</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn">
        <i class="fas fa-bars"></i>
    </button>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">🌰</div>
            <h2>ف<span>ندق</span></h2>
        </div>
        <nav class="menu">
            <a href="index.html" class="menu-item">
                <span class="menu-icon">🏠</span>
                <span>داشبورد</span>
            </a>
            <a href="lessons.html" class="menu-item">
                <span class="menu-icon">📚</span>
                <span>درس‌ها</span>
            </a>
            <a href="profile.html" class="menu-item active">
                <span class="menu-icon">👤</span>
                <span>پروفایل</span>
            </a>
            <a href="support.html" class="menu-item">
                <span class="menu-icon">💬</span>
                <span>پشتیبانی</span>
            </a>
            <a href="earn-coins.html" class="menu-item">
                <span class="menu-icon">🪙</span>
                <span>سکه رایگان</span>
            </a>
            <a href="login.html" class="menu-item">
                <span class="menu-icon">🔐</span>
                <span>ورود</span>
            </a>
            <a href="admin.html" class="menu-item" id="adminMenuItem" style="display:none;">
                <span class="menu-icon">⚙️</span>
                <span>پنل مدیریت</span>
            </a>
        </nav>
    </aside>

    <main class="main">

        <header class="topbar">
            <div class="welcome">
                <h1>👤 پروفایل من</h1>
                <p>اطلاعات خودت رو مدیریت کن.</p>
            </div>
            <div class="user">
                <div class="user-info">
                    <strong id="headerUsername">کاربر مهمان</strong>
                    <span id="headerUserStatus">ثبت‌نام نشده</span>
                </div>
                <div class="avatar">👤</div>
            </div>
        </header>

        <section class="profile-card">
            <div class="profile-avatar">
                <div class="profile-avatar-icon">👤</div>
                <h2 id="profileName">کاربر مهمان</h2>
                <p style="color:#7f8da5;" id="profileStatus">ثبت‌نام نشده</p>
            </div>
            <div class="profile-info">
                <div class="info-item">
                    <span class="info-label">📚 درس‌های تکمیل شده</span>
                    <span class="info-value" id="profileCompleted">۰</span>
                </div>
                <div class="info-item">
                    <span class="info-label">🔥 روزهای متوالی</span>
                    <span class="info-value" id="profileStreak">۰</span>
                </div>
                <div class="info-item">
                    <span class="info-label">⏱️ زمان مطالعه</span>
                    <span class="info-value" id="profileHours">۰ ساعت</span>
                </div>
                <div class="info-item">
                    <span class="info-label">🪙 سکه‌ها</span>
                    <span class="info-value" id="profileCoins">۰</span>
                </div>
            </div>
        </section>

        <section class="profile-settings">
            <h3 style="margin-bottom:15px;">⚙️ تنظیمات پروفایل</h3>
            <div class="setting-item">
                <label>نام کاربری</label>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <input type="text" id="nameInput" placeholder="نام جدید..." style="flex:1;min-width:150px;padding:10px 15px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:#07152b;color:#fff;font-family:'Vazirmatn',sans-serif;">
                    <button class="primary-btn" id="saveNameBtn">ذخیره نام</button>
                </div>
            </div>
            <div class="setting-item" style="border-bottom:none;padding-bottom:0;">
                <label>🗑️ خطرناک</label>
                <button class="primary-btn secondary" id="resetAllBtn" style="border-color:#ef4444;color:#ef4444;">
                    🗑️ ریست کردن همه داده‌ها
                </button>
            </div>
            <div class="setting-item" style="border-bottom:none;padding-bottom:0;margin-top:10px;">
                <label>🚪 خروج</label>
                <button class="primary-btn secondary" id="logoutBtn" style="border-color:#f59e0b;color:#f59e0b;">
                    🚪 خروج از حساب کاربری
                </button>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
