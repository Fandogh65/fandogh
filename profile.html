<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | فندق</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon">🌰</div>
            <h2>ف<span>ندق</span></h2>
        </div>
        <nav class="menu">
            <a href="index.html" class="menu-item">🏠 داشبورد</a>
            <a href="lessons.html" class="menu-item">📚 درس‌ها</a>
            <a href="profile.html" class="menu-item active">👤 پروفایل</a>
            <a href="support.html" class="menu-item">💬 پشتیبانی</a>
            <a href="earn-coins.html" class="menu-item">🪙 سکه رایگان</a>
            <a href="login.html" class="menu-item" id="loginMenuItem">🔐 ورود</a>
            <a href="register.html" class="menu-item" id="registerMenuItem">📝 ثبت‌نام</a>
            <a href="#" class="menu-item" id="logoutMenuItem" style="display:none;" onclick="logoutUser()">🚪 خروج</a>
            <a href="admin.html" class="menu-item" id="adminMenuItem" style="display:none;">⚙️ پنل مدیریت</a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="welcome">
                <h1>👤 پروفایل</h1>
                <p>اطلاعات خودت رو مدیریت کن</p>
            </div>
            <div class="user">
                <div class="user-info">
                    <strong id="headerUsername">کاربر مهمان</strong>
                    <span id="headerUserStatus">ثبت‌نام نشده</span>
                </div>
                <div class="coin-display">
                    <span class="coin-icon">🪙</span>
                    <span class="coin-count" id="headerCoinCount">0</span>
                </div>
                <div class="avatar">👤</div>
            </div>
        </header>

        <section class="profile-card">
            <div class="profile-avatar">
                <div class="profile-avatar-icon">👤</div>
                <h2 id="profileName">کاربر مهمان</h2>
                <p style="color:#7f8da5;" id="profileStatus">ثبت‌نام نشده</p>
            </div>
            <div class="profile-info">
                <div class="info-item"><span class="info-label">📚 درس‌ها</span><span class="info-value" id="profileCompleted">۰</span></div>
                <div class="info-item"><span class="info-label">🔥 روزها</span><span class="info-value" id="profileStreak">۰</span></div>
                <div class="info-item"><span class="info-label">⏱️ زمان</span><span class="info-value" id="profileHours">۰ ساعت</span></div>
                <div class="info-item"><span class="info-label">🪙 سکه</span><span class="info-value" id="profileCoins">۰</span></div>
            </div>
        </section>

        <section class="profile-settings">
            <h3>⚙️ تنظیمات</h3>
            <div class="setting-item">
                <label>نام کاربری</label>
                <div style="display:flex;gap:10px;">
                    <input type="text" id="nameInput" placeholder="نام جدید..." style="flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#07152b;color:#fff;">
                    <button class="primary-btn" id="saveNameBtn">ذخیره</button>
                </div>
            </div>
            <div class="setting-item">
                <button class="primary-btn secondary" id="resetAllBtn" style="border-color:#ef4444;color:#ef4444;">🗑️ ریست همه</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
