<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | فندق</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon">🌰</div>
            <h2>ف<span>ندق</span></h2>
        </div>
        <nav class="menu">
            <a href="index.html" class="menu-item">🏠 داشبورد</a>
            <a href="lessons.html" class="menu-item">📚 درس‌ها</a>
            <a href="profile.html" class="menu-item active">👤 پروفایل</a>
            <a href="support.html" class="menu-item">💬 پشتیبانی</a>
            <a href="earn-coins.html" class="menu-item">🪙 سکه رایگان</a>
            <a href="login.html" class="menu-item" id="loginMenuItem">🔐 ورود</a>
            <a href="register.html" class="menu-item" id="registerMenuItem">📝 ثبت‌نام</a>
            <a href="#" class="menu-item" id="logoutMenuItem" style="display:none;" onclick="logoutUser()">🚪 خروج</a>
            <a href="admin.html" class="menu-item" id="adminMenuItem" style="display:none;">⚙️ پنل مدیریت</a>
        </nav>
    </aside>

    <main class="main">
        
        <!-- دکمه بازگشت به داشبورد -->
        <button class="back-home-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-home"></i>
        </button>

        <header class="topbar">
            <div class="welcome">
                <h1>👤 پروفایل</h1>
                <p>اطلاعات خودت رو مدیریت کن</p>
            </div>
            <div class="user">
                <div class="user-info">
                    <strong id="headerUsername">کاربر مهمان</strong>
                    <span id="headerUserStatus">ثبت‌نام نشده</span>
                </div>
                <div class="coin-display">
                    <span class="coin-icon">🪙</span>
                    <span class="coin-count" id="headerCoinCount">0</span>
                </div>
                <!-- ===== ماسکات فندق در هدر ===== -->
                <div class="avatar" id="headerAvatar">
                    <img src="assets/mascot/hazelnut.png" alt="فندق" class="mascot-avatar">
                </div>
            </div>
        </header>

        <section class="profile-card">
            <div class="profile-avatar">
                <!-- ===== ماسکات فندق خوشحال در پروفایل ===== -->
                <img src="assets/mascot/hazelnut-happy.png" alt="فندق خوشحال" class="profile-mascot">
                <h2 id="profileName">کاربر مهمان</h2>
                <p style="color:#7f8da5;" id="profileStatus">ثبت‌نام نشده</p>
            </div>
            <div class="profile-info">
                <div class="info-item"><span class="info-label">📚 درس‌ها</span><span class="info-value" id="profileCompleted">۰</span></div>
                <div class="info-item"><span class="info-label">🔥 روزها</span><span class="info-value" id="profileStreak">۰</span></div>
                <div class="info-item"><span class="info-label">⏱️ زمان</span><span class="info-value" id="profileHours">۰ ساعت</span></div>
                <div class="info-item"><span class="info-label">🪙 سکه</span><span class="info-value" id="profileCoins">۰</span></div>
            </div>
        </section>

        <section class="profile-settings">
            <h3>⚙️ تنظیمات</h3>
            <div class="setting-item">
                <label>نام کاربری</label>
                <div style="display:flex;gap:10px;">
                    <input type="text" id="nameInput" placeholder="نام جدید..." style="flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#07152b;color:#fff;">
                    <button class="primary-btn" id="saveNameBtn">ذخیره</button>
                </div>
            </div>
            <div class="setting-item">
                <button class="primary-btn secondary" id="resetAllBtn" style="border-color:#ef4444;color:#ef4444;">🗑️ ریست همه</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        // ===== منوی کشویی =====
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function closeMenu() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        document.querySelectorAll('.menu-item').forEach(function(item) {
            item.addEventListener('click', function() {
                if (window.innerWidth <= 768) {
                    closeMenu();
                }
            });
        });

        // ===== ذخیره نام کاربری =====
        document.getElementById('saveNameBtn').addEventListener('click', function() {
            var name = document.getElementById('nameInput').value.trim();
            if (name === '') {
                alert('لطفاً یک نام وارد کن!');
                return;
            }
            localStorage.setItem('fandogh_username', name);
            document.getElementById('profileName').textContent = name;
            document.getElementById('headerUsername').textContent = name;
            document.getElementById('userDisplayName').textContent = name;
            alert('✅ نام با موفقیت ذخیره شد!');
        });

        // ===== ریست همه =====
        document.getElementById('resetAllBtn').addEventListener('click', function() {
            if (confirm('⚠️ همه داده‌ها پاک میشن! مطمئنی؟')) {
                localStorage.clear();
                document.getElementById('profileName').textContent = 'کاربر مهمان';
                document.getElementById('headerUsername').textContent = 'کاربر مهمان';
                document.getElementById('userDisplayName').textContent = 'کاربر مهمان';
                document.getElementById('nameInput').value = '';
                document.getElementById('headerCoinCount').textContent = '0';
                document.getElementById('profileCoins').textContent = '0';
                document.getElementById('profileCompleted').textContent = '۰';
                document.getElementById('profileStreak').textContent = '۰';
                document.getElementById('profileHours').textContent = '۰ ساعت';
                alert('🗑️ همه داده‌ها ریست شد!');
            }
        });

        // ===== بارگذاری اطلاعات =====
        document.addEventListener('DOMContentLoaded', function() {
            var savedName = localStorage.getItem('fandogh_username');
            if (savedName) {
                document.getElementById('profileName').textContent = savedName;
                document.getElementById('headerUsername').textContent = savedName;
                document.getElementById('userDisplayName').textContent = savedName;
                document.getElementById('nameInput').value = savedName;
            }
        });
    </script>

</body>
</html>
