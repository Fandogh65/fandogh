<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | فندق</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <div class="logo-icon">🌰</div>
            <h2>ف<span>ندق</span></h2>
        </div>
        <nav class="menu">
            <a href="index.html" class="menu-item">🏠 داشبورد</a>
            <a href="lessons.html" class="menu-item">📚 درس‌ها</a>
            <a href="profile.html" class="menu-item">👤 پروفایل</a>
            <a href="support.html" class="menu-item">💬 پشتیبانی</a>
            <a href="earn-coins.html" class="menu-item">🪙 سکه رایگان</a>
            <a href="login.html" class="menu-item">🔐 ورود</a>
            <a href="register.html" class="menu-item active">📝 ثبت‌نام</a>
            <a href="#" class="menu-item" id="logoutMenuItem" style="display:none;" onclick="logoutUser()">🚪 خروج</a>
            <a href="admin.html" class="menu-item" id="adminMenuItem" style="display:none;">⚙️ پنل مدیریت</a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="welcome">
                <h1>📝 ثبت‌نام</h1>
                <p>ایجاد حساب کاربری جدید</p>
            </div>
            <div class="user">
                <div class="user-info">
                    <strong id="headerUsername">کاربر مهمان</strong>
                    <span id="headerUserStatus">ثبت‌نام نشده</span>
                </div>
                <div class="coin-display">
                    <span class="coin-icon">🪙</span>
                    <span class="coin-count" id="headerCoinCount">0</span>
                </div>
                <div class="avatar">👤</div>
            </div>
        </header>

        <section class="auth-card">
            <form id="registerForm" onsubmit="return false;">
                <h3>🔑 اطلاعات کاربری</h3>
                <div class="form-group">
                    <label>نام کاربری</label>
                    <input type="text" id="regUsername" placeholder="فقط حروف انگلیسی" required>
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="regPassword" placeholder="حداقل ۸ کاراکتر" required>
                </div>
                <div class="form-group">
                    <label>تکرار رمز</label>
                    <input type="password" id="regPasswordConfirm" placeholder="دوباره وارد کن" required>
                </div>
                <button type="button" class="primary-btn" onclick="registerUser()" style="width:100%;">✅ ثبت‌نام</button>
                <div style="text-align:center;margin-top:15px;color:#7f8da5;font-size:13px;">
                    قبلاً ثبت‌نام کردی؟ <a href="login.html" style="color:#2dd4bf;">وارد شو</a>
                </div>
            </form>
            <div id="registerMessage" class="msg"></div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        function registerUser() {
            var username = document.getElementById('regUsername').value.trim();
            var password = document.getElementById('regPassword').value;
            var passConfirm = document.getElementById('regPasswordConfirm').value;
            var msg = document.getElementById('registerMessage');
            if (!username || !password || !passConfirm) { msg.className = 'msg error'; msg.textContent = '⚠️ همه فیلدها را پر کن!'; return; }
            if (username.length < 3) { msg.className = 'msg error'; msg.textContent = '⚠️ نام کاربری حداقل ۳ کاراکتر!'; return; }
            if (password.length < 8) { msg.className = 'msg error'; msg.textContent = '⚠️ رمز حداقل ۸ کاراکتر!'; return; }
            if (password !== passConfirm) { msg.className = 'msg error'; msg.textContent = '⚠️ رمزها مطابقت ندارند!'; return; }
            var users = getData('users', []);
            if (users.find(function(u) { return u.username === username; })) { msg.className = 'msg error'; msg.textContent = '⚠️ این نام کاربری قبلاً ثبت شده!'; return; }
            users.push({ username: username, password: password, isAdmin: false });
            setData('users', users);
            setData('currentUser', username);
            msg.className = 'msg success'; msg.textContent = '🎉 ثبت‌نام موفق!';
            setTimeout(function() { window.location.href = 'index.html'; }, 800);
        }
    </script>
</body>
</html>
